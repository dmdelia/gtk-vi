name: Windows Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Godot version
        run: godot --version
      - name: Import and check scripts
        run: |
          godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/godot-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script" /tmp/godot-import.log
      - name: Exercise Story, Free Mode, cheats and saving
        run: |
          timeout 180 godot --headless --path . --script res://tests/smoke_test.gd 2>&1 | tee /tmp/godot-smoke.log
          grep -q "SMOKE TEST PASS" /tmp/godot-smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access" /tmp/godot-smoke.log
      - name: Export Windows game
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/KARTON-EU-IV.exe
          test -s build/windows/KARTON-EU-IV.exe
          test -s build/windows/KARTON-EU-IV.pck
      - name: Package full standalone Windows build
        run: |
          cd build/windows
          zip -9 -j ../../KARTON-EU-IV-windows.zip KARTON-EU-IV.exe KARTON-EU-IV.pck
      - uses: actions/upload-artifact@v4
        with:
          name: KARTON-EU-IV-windows
          path: KARTON-EU-IV-windows.zip
      - name: Publish tested build to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
            EXTRA_FLAGS="--verify-tag"
          else
            VERSION="v0.1.1-prealpha"
            EXTRA_FLAGS="--prerelease --target ${GITHUB_SHA}"
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" KARTON-EU-IV-windows.zip --clobber
          else
            gh release create "$VERSION" KARTON-EU-IV-windows.zip --title "KARTON EU IV $VERSION" --generate-notes $EXTRA_FLAGS
          fi
