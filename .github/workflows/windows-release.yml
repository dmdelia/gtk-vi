name: Windows Build & Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import and validate Godot project
        run: |
          godot --headless --editor --path . --import --quit
          godot --headless --path . --quit-after 120
      - name: Export Windows game
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/KARTON-EU-IV.exe
          test -s build/windows/KARTON-EU-IV.exe
          test -s build/windows/KARTON-EU-IV.pck
      - name: Package Windows build
        run: |
          cd build/windows
          zip -9 -j ../../KARTON-EU-IV-windows.zip KARTON-EU-IV.exe KARTON-EU-IV.pck
      - uses: actions/upload-artifact@v4
        with:
          name: KARTON-EU-IV-windows
          path: KARTON-EU-IV-windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" KARTON-EU-IV-windows.zip --generate-notes --verify-tag
